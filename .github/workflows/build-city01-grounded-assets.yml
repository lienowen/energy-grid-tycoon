name: Build City-01 grounded assets

on:
  push:
    branches:
      - feat/commercial-standard-recovery-v1
    paths:
      - scripts/generate-city01-grounded-assets.py
      - .github/workflows/build-city01-grounded-assets.yml
      - public/assets/city01/product/districts/district-residential-base.png
  pull_request:
    branches:
      - main
    paths:
      - scripts/generate-city01-grounded-assets.py
      - .github/workflows/build-city01-grounded-assets.yml
      - public/assets/city01/product/districts/district-residential-base.png
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Generate residential integrated PNG
        run: |
          mkdir -p generated/city01
          cp public/assets/city01/product/districts/district-residential-base.png \
            generated/city01/district-residential-source.png
          python scripts/generate-city01-grounded-assets.py \
            --output generated/city01/district-residential-integrated.png \
            --diagnostics generated/city01/diagnostics.json

      - name: Upload generated assets
        uses: actions/upload-artifact@v4
        with:
          name: city01-grounded-assets-${{ github.sha }}
          path: generated/city01
          if-no-files-found: error
          retention-days: 14

      - name: Publish generated PNG through Contents API
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          target=public/assets/city01/product/districts/runtime/district-residential-integrated.png
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          source = Path('generated/city01/district-residential-integrated.png')
          payload = {
              'message': 'art: publish City-01 residential integrated PNG [skip ci]',
              'content': base64.b64encode(source.read_bytes()).decode('ascii'),
              'branch': os.environ['TARGET_BRANCH'],
          }
          Path('/tmp/residential-publish.json').write_text(json.dumps(payload), encoding='utf-8')
          PY
          gh api --method PUT \
            "repos/${GITHUB_REPOSITORY}/contents/${target}" \
            --input /tmp/residential-publish.json
