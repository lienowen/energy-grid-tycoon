name: Build City-01 grounded assets

on:
  push:
    branches:
      - feat/commercial-standard-recovery-v1
    paths:
      - scripts/generate-city01-grounded-assets.py
      - .github/workflows/build-city01-grounded-assets.yml
      - public/assets/city01/product/districts/district-residential-base.png
  pull_request:
    branches:
      - main
    paths:
      - scripts/generate-city01-grounded-assets.py
      - .github/workflows/build-city01-grounded-assets.yml
      - public/assets/city01/product/districts/district-residential-base.png
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Generate residential grounded PNG
        run: |
          mkdir -p generated/city01
          python scripts/generate-city01-grounded-assets.py \
            --output generated/city01/district-residential-grounded.png \
            --diagnostics generated/city01/diagnostics.json

      - name: Upload generated asset
        uses: actions/upload-artifact@v4
        with:
          name: city01-grounded-assets-${{ github.sha }}
          path: generated/city01
          if-no-files-found: error
          retention-days: 14

      - name: Publish generated PNG to development branch
        if: github.event_name == 'push'
        run: |
          target=public/assets/city01/product/districts/runtime/district-residential-grounded.png
          mkdir -p "$(dirname "$target")"
          cp generated/city01/district-residential-grounded.png "$target"
          if git diff --quiet -- "$target"; then
            echo "Generated residential PNG is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git commit -m "art: publish City-01 residential grounded PNG [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
