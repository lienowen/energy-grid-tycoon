<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1536" viewBox="0 0 2048 1536">
  <defs>
    <filter id="road-shadow" x="-20%" y="-45%" width="140%" height="190%"><feGaussianBlur stdDeviation="5"/></filter>
    <linearGradient id="asphalt" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#626a6a"/><stop offset=".52" stop-color="#4b5354"/><stop offset="1" stop-color="#343d3f"/></linearGradient>
    <linearGradient id="collector" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#596162"/><stop offset="1" stop-color="#414a4b"/></linearGradient>
    <linearGradient id="curb" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eee7d7"/><stop offset="1" stop-color="#bdb29d"/></linearGradient>
  </defs>

  <!-- One readable urban ring replaces the old separated road strips. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M800 725 C850 690 909 654 965 650 C997 669 1004 706 997 748 C1071 731 1146 730 1220 743 C1178 789 1110 827 1030 845 C938 827 859 786 800 725 Z"
          stroke="#071115" stroke-opacity=".4" stroke-width="54" filter="url(#road-shadow)"/>
    <path d="M800 725 C850 690 909 654 965 650 C997 669 1004 706 997 748 C1071 731 1146 730 1220 743 C1178 789 1110 827 1030 845 C938 827 859 786 800 725 Z"
          stroke="url(#curb)" stroke-width="47"/>
    <path d="M800 725 C850 690 909 654 965 650 C997 669 1004 706 997 748 C1071 731 1146 730 1220 743 C1178 789 1110 827 1030 845 C938 827 859 786 800 725 Z"
          stroke="#252e30" stroke-width="40"/>
    <path d="M800 725 C850 690 909 654 965 650 C997 669 1004 706 997 748 C1071 731 1146 730 1220 743 C1178 789 1110 827 1030 845 C938 827 859 786 800 725 Z"
          stroke="url(#asphalt)" stroke-width="32"/>
    <path d="M800 725 C850 690 909 654 965 650 C997 669 1004 706 997 748 C1071 731 1146 730 1220 743 C1178 789 1110 827 1030 845 C938 827 859 786 800 725 Z"
          stroke="#e7cb64" stroke-opacity=".44" stroke-width="2.3" stroke-dasharray="15 13"/>
  </g>

  <!-- Cross-city boulevards make the five districts read as one connected place. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M965 650 C1018 696 1028 770 1030 845 M800 725 C875 724 938 735 997 748 M997 748 C1072 779 1137 780 1220 743"
          stroke="#071115" stroke-opacity=".34" stroke-width="44" filter="url(#road-shadow)"/>
    <path d="M965 650 C1018 696 1028 770 1030 845 M800 725 C875 724 938 735 997 748 M997 748 C1072 779 1137 780 1220 743"
          stroke="url(#curb)" stroke-width="38"/>
    <path d="M965 650 C1018 696 1028 770 1030 845 M800 725 C875 724 938 735 997 748 M997 748 C1072 779 1137 780 1220 743"
          stroke="#293234" stroke-width="32"/>
    <path d="M965 650 C1018 696 1028 770 1030 845 M800 725 C875 724 938 735 997 748 M997 748 C1072 779 1137 780 1220 743"
          stroke="url(#collector)" stroke-width="25"/>
  </g>

  <!-- Short access streets visibly seat facilities and districts into the same road system. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M965 650 L975 614 M800 725 L792 668 M1220 743 L1249 827 M1030 845 L1064 874 M997 748 L1075 769 M1220 743 L1264 720 M1030 845 L975 889"
          stroke="#071115" stroke-opacity=".3" stroke-width="32" filter="url(#road-shadow)"/>
    <path d="M965 650 L975 614 M800 725 L792 668 M1220 743 L1249 827 M1030 845 L1064 874 M997 748 L1075 769 M1220 743 L1264 720 M1030 845 L975 889"
          stroke="url(#curb)" stroke-width="27"/>
    <path d="M965 650 L975 614 M800 725 L792 668 M1220 743 L1249 827 M1030 845 L1064 874 M997 748 L1075 769 M1220 743 L1264 720 M1030 845 L975 889"
          stroke="#485152" stroke-width="20"/>
  </g>

  <!-- Civic roundabout gives the compact city a clear visual center. -->
  <ellipse cx="997" cy="748" rx="34" ry="18" fill="url(#curb)"/>
  <ellipse cx="997" cy="748" rx="27" ry="13" fill="#444d4e" stroke="#252e30" stroke-width="3"/>
  <ellipse cx="997" cy="748" rx="12" ry="6" fill="#6e8a68"/>
  <ellipse cx="997" cy="746" rx="5" ry="3" fill="#d8e4c9" opacity=".55"/>
