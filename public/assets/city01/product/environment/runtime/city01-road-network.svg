<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1536" viewBox="0 0 2048 1536">
  <defs>
    <filter id="road-shadow" x="-20%" y="-45%" width="140%" height="190%"><feGaussianBlur stdDeviation="5"/></filter>
    <linearGradient id="asphalt" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5d6464"/><stop offset=".55" stop-color="#484f50"/><stop offset="1" stop-color="#373f41"/></linearGradient>
    <linearGradient id="collector" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#555d5d"/><stop offset="1" stop-color="#41494a"/></linearGradient>
    <linearGradient id="curb" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e1ddcf"/><stop offset="1" stop-color="#b7ad99"/></linearGradient>
  </defs>

  <!-- Primary city spine: old town -> commercial -> civic -> residential. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M694 714 C765 680 827 650 884 637 C912 630 935 630 956 638 C970 676 980 713 990 754 C1081 734 1182 741 1308 772"
          stroke="#071115" stroke-opacity=".38" stroke-width="52" filter="url(#road-shadow)"/>
    <path d="M694 714 C765 680 827 650 884 637 C912 630 935 630 956 638 C970 676 980 713 990 754 C1081 734 1182 741 1308 772"
          stroke="url(#curb)" stroke-width="45"/>
    <path d="M694 714 C765 680 827 650 884 637 C912 630 935 630 956 638 C970 676 980 713 990 754 C1081 734 1182 741 1308 772"
          stroke="#252e30" stroke-width="38"/>
    <path d="M694 714 C765 680 827 650 884 637 C912 630 935 630 956 638 C970 676 980 713 990 754 C1081 734 1182 741 1308 772"
          stroke="url(#asphalt)" stroke-width="31"/>
    <path d="M694 714 C765 680 827 650 884 637 C912 630 935 630 956 638 C970 676 980 713 990 754 C1081 734 1182 741 1308 772"
          stroke="#e0c45e" stroke-opacity=".4" stroke-width="2.2" stroke-dasharray="15 13"/>
  </g>

  <!-- Civic-to-industrial and industrial-to-energy logistics corridor. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M990 754 C995 802 1014 846 1044 884 C1132 894 1238 854 1341 790"
          stroke="#071115" stroke-opacity=".36" stroke-width="48" filter="url(#road-shadow)"/>
    <path d="M990 754 C995 802 1014 846 1044 884 C1132 894 1238 854 1341 790"
          stroke="url(#curb)" stroke-width="41"/>
    <path d="M990 754 C995 802 1014 846 1044 884 C1132 894 1238 854 1341 790"
          stroke="#252e30" stroke-width="34"/>
    <path d="M990 754 C995 802 1014 846 1044 884 C1132 894 1238 854 1341 790"
          stroke="url(#asphalt)" stroke-width="27"/>
    <path d="M990 754 C995 802 1014 846 1044 884 C1132 894 1238 854 1341 790"
          stroke="#e0c45e" stroke-opacity=".34" stroke-width="2" stroke-dasharray="14 12"/>
  </g>

  <!-- Secondary links close the gaps between prefab district entrances. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M694 714 C790 755 886 775 990 754 M956 638 C1044 654 1121 695 1186 744 M1044 884 C1008 909 966 919 918 911 M1308 772 C1340 774 1363 782 1384 800"
