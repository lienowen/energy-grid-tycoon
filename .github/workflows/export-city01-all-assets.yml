name: Export City-01 all assets

on:
  push:
    branches:
      - feat/commercial-standard-recovery-v1
    paths:
      - .github/workflows/export-city01-all-assets.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect City-01 assets
        run: |
          mkdir -p exported
          cp -R public/assets/city01/product exported/city01-product
          if [ -d public/assets/single/v1 ]; then
            cp -R public/assets/single/v1 exported/single-v1
          fi
          find exported -type f | sort > exported/files.txt

      - name: Upload asset pack
        uses: actions/upload-artifact@v4
        with:
          name: city01-all-assets-${{ github.sha }}
          path: exported
          if-no-files-found: error
          retention-days: 7
