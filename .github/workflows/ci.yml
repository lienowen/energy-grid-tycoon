name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]

permissions:
  contents: read
  statuses: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Validate product scope
        shell: bash
        run: |
          set -o pipefail
          npm run check:product 2>&1 | tee check-product.log
      - name: Validate content and assets
        shell: bash
        run: |
          set -o pipefail
          npm run check:content 2>&1 | tee check-content.log
      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log
      - name: Typecheck and production build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      - name: Upload quality logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-log
          path: |
            check-product.log
            check-content.log
            test.log
            build.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Publish main quality status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CI_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          CI_DESCRIPTION: ${{ job.status == 'success' && '产品范围、资源、测试、类型与生产构建通过' || '主干质量门失败，请查看运行日志' }}
          CI_TARGET_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n \
            --arg state "$CI_STATE" \
            --arg context "GitHub Actions / CI" \
            --arg description "$CI_DESCRIPTION" \
            --arg target_url "$CI_TARGET_URL" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' \
          | curl --fail-with-body -L \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
              --data-binary @-
