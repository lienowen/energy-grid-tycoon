    <path d="M694 714 C790 755 886 775 990 754 M956 638 C1044 654 1121 695 1186 744 M1044 884 C1008 909 966 919 918 911 M1308 772 C1340 774 1363 782 1384 800"
          stroke="#293234" stroke-width="27"/>
    <path d="M694 714 C790 755 886 775 990 754 M956 638 C1044 654 1121 695 1186 744 M1044 884 C1008 909 966 919 918 911 M1308 772 C1340 774 1363 782 1384 800"
          stroke="url(#collector)" stroke-width="21"/>
  </g>

  <!-- Short entrance aprons visually merge the district artwork into the city roads. -->
  <g fill="none" stroke-linecap="butt" stroke-linejoin="round">
    <path d="M694 714 L646 730 M884 637 L885 590 M956 638 L1004 601 M1186 744 L1240 718 M1308 772 L1354 752 M990 754 L944 787 M1044 884 L1072 925 M1341 790 L1390 770"
