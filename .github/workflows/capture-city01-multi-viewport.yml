name: Capture City01 multi viewport

on:
  push:
    branches: [main]
    paths:
      - scripts/capture-city01-multi-viewport.mjs
      - .github/workflows/capture-city01-multi-viewport.yml
      - src/main.ts
      - src/core/**
      - src/data/**
      - src/presentation/**
      - src/ui/**
      - src/systems/**
      - src/buildings/**
      - src/rules/**
      - src/resources/**
      - public/assets/**
      - '!src/battle/**'
      - '!src/resources/City01GridDefenseAssetCatalog.ts'
      - '!public/assets/energy_grid_asset_pack/**'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  capture-multi-viewport:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install application
        run: npm install --no-audit --no-fund

      - name: Install capture browser
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Build production application
        run: npm run build

      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/city01-preview.log 2>&1 &
          echo $! > /tmp/city01-preview.pid
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/city01-preview.log
          exit 1

      - name: Capture legacy Tycoon city grid and placement views
        env:
          CITY01_CAPTURE_URL: http://127.0.0.1:4173/?mode=tycoon
          CITY01_CAPTURE_DIR: artifacts/city01-multi-viewport
        run: node scripts/capture-city01-multi-viewport.mjs

      - name: Upload multi viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: city01-main-multi-viewport-${{ github.sha }}
          path: artifacts/city01-multi-viewport
          if-no-files-found: error
          retention-days: 14

      - name: Stop production preview
        if: always()
        run: |
          if test -f /tmp/city01-preview.pid; then
            kill "$(cat /tmp/city01-preview.pid)" || true
          fi

      - name: Publish screenshot status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CAPTURE_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          CAPTURE_DESCRIPTION: ${{ job.status == 'success' && '旧版 Tycoon 桌面、手机、电网与建造选址截图通过' || '旧版 Tycoon 多端或建造选址截图失败' }}
          CAPTURE_TARGET_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n \
            --arg state "$CAPTURE_STATE" \
            --arg context "GitHub Actions / City01 screenshots" \
            --arg description "$CAPTURE_DESCRIPTION" \
            --arg target_url "$CAPTURE_TARGET_URL" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' \
          | curl --fail-with-body -L \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
              --data-binary @-
