name: Export City01 district sources

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'feat/commercial-standard-recovery-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rebuild branch
        uses: actions/checkout@v4
        with:
          ref: feat/commercial-standard-recovery-v1
      - name: Verify district source pack
        run: |
          test -f public/assets/city01/product/districts/district-residential-base.png
          test -f public/assets/city01/product/districts/district-commercial-base.png
          test -f public/assets/city01/product/districts/district-industrial-base.png
          test -f public/assets/city01/product/districts/district-public-base.png
          test -f public/assets/city01/product/districts/district-old-town-base.png
      - name: Upload district sources
        uses: actions/upload-artifact@v4
        with:
          name: city01-district-sources-${{ github.sha }}
          path: public/assets/city01/product/districts/*.png
          if-no-files-found: error
          retention-days: 2
