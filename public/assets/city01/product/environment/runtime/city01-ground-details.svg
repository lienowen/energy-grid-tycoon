<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1536" viewBox="0 0 2048 1536">
  <defs>
    <linearGradient id="park" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6f8c66" stop-opacity=".42"/>
      <stop offset="1" stop-color="#3c6149" stop-opacity=".34"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d7cfb8" stop-opacity=".42"/>
      <stop offset="1" stop-color="#a99d82" stop-opacity=".34"/>
    </linearGradient>
    <linearGradient id="paving" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#899083" stop-opacity=".26"/>
      <stop offset="1" stop-color="#59645d" stop-opacity=".18"/>
    </linearGradient>
    <radialGradient id="canopy" cx="38%" cy="30%" r="72%">
      <stop stop-color="#789b64" stop-opacity=".84"/>
      <stop offset=".58" stop-color="#3f704d" stop-opacity=".86"/>
      <stop offset="1" stop-color="#244d3a" stop-opacity=".8"/>
    </radialGradient>
    <filter id="soft-shadow" x="-35%" y="-90%" width="170%" height="280%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Shared civic green at the visual center. -->
  <g transform="translate(985 754)" opacity=".7">
    <ellipse cx="0" cy="13" rx="88" ry="20" fill="#0b1d19" opacity=".15" filter="url(#soft-shadow)"/>
    <path d="M-92 1 L-23 -34 L94 -4 L25 30 Z" fill="url(#park)"/>
    <path d="M-58 -2 L13 21 M-12 -26 L47 7" fill="none" stroke="url(#path)" stroke-width="5" stroke-linecap="round"/>
    <g fill="url(#canopy)">
      <ellipse cx="-58" cy="-10" rx="10" ry="8"/><ellipse cx="-32" cy="8" rx="9" ry="7"/>
      <ellipse cx="8" cy="-11" rx="11" ry="8"/><ellipse cx="43" cy="5" rx="9" ry="7"/>
      <ellipse cx="68" cy="-7" rx="8" ry="6"/>
    </g>
  </g>

  <!-- Transition plazas fill the empty seams between district prefab bases. -->
  <g opacity=".54">
    <path d="M744 674 L816 638 L874 653 L800 691 Z" fill="url(#paving)"/>
    <path d="M1008 688 L1081 671 L1137 700 L1063 722 Z" fill="url(#paving)"/>
    <path d="M1084 798 L1171 781 L1225 810 L1135 830 Z" fill="url(#paving)"/>
    <path d="M958 843 L1030 823 L1083 851 L1008 875 Z" fill="url(#paving)"/>
  </g>

  <!-- Tree-lined boulevards visually continue through the gaps. -->
  <g fill="url(#canopy)" opacity=".66">
    <ellipse cx="736" cy="680" rx="9" ry="7"/><ellipse cx="770" cy="662" rx="8" ry="6"/><ellipse cx="805" cy="648" rx="9" ry="7"/>
    <ellipse cx="839" cy="638" rx="8" ry="6"/><ellipse cx="873" cy="631" rx="9" ry="7"/>
    <ellipse cx="1019" cy="727" rx="8" ry="6"/><ellipse cx="1063" cy="716" rx="9" ry="7"/><ellipse cx="1108" cy="711" rx="8" ry="6"/>
    <ellipse cx="1154" cy="713" rx="9" ry="7"/><ellipse cx="1200" cy="722" rx="8" ry="6"/><ellipse cx="1246" cy="737" rx="9" ry="7"/>
    <ellipse cx="1019" cy="797" rx="8" ry="6"/><ellipse cx="1027" cy="826" rx="9" ry="7"/><ellipse cx="1037" cy="855" rx="8" ry="6"/>
    <ellipse cx="1098" cy="884" rx="9" ry="7"/><ellipse cx="1142" cy="877" rx="8" ry="6"/><ellipse cx="1187" cy="864" rx="9" ry="7"/>
    <ellipse cx="1230" cy="846" rx="8" ry="6"/><ellipse cx="1271" cy="824" rx="9" ry="7"/>
  </g>

  <!-- Low-key medians and pedestrian strips make the roads feel authored as one system. -->
  <g fill="none" stroke-linecap="round" opacity=".38">
    <path d="M722 702 C790 670 844 650 901 643" stroke="#8aa27e" stroke-width="6"/>
    <path d="M1024 773 C1109 755 1198 758 1283 779" stroke="#8aa27e" stroke-width="6"/>
    <path d="M1061 901 C1145 900 1227 868 1301 821" stroke="#718d6f" stroke-width="6"/>
  </g>

  <!-- Industrial edge parking and service yards soften the jump into the energy quarter. -->
  <g transform="translate(1135 900)" opacity=".46">
    <path d="M-89 0 L-21 -30 L93 -2 L23 28 Z" fill="#676f6d" opacity=".34"/>
    <g fill="none" stroke="#d7d2c2" stroke-opacity=".3" stroke-width="2">
      <path d="M-62 -3 L-40 4 M-31 -12 L-8 -5 M0 -19 L23 -12 M31 -12 L55 -5 M61 -4 L82 3"/>
    </g>
  </g>

  <!-- Coastal and edge vegetation keeps the island from reading as a hard display board. -->
  <g fill="url(#canopy)" opacity=".5">
    <ellipse cx="588" cy="648" rx="9" ry="7"/><ellipse cx="612" cy="627" rx="8" ry="6"/><ellipse cx="640" cy="610" rx="9" ry="7"/>
    <ellipse cx="1373" cy="744" rx="9" ry="7"/><ellipse cx="1397" cy="765" rx="7" ry="6"/><ellipse cx="1414" cy="791" rx="8" ry="6"/>
    <ellipse cx="625" cy="796" rx="8" ry="6"/><ellipse cx="650" cy="814" rx="7" ry="5"/><ellipse cx="678" cy="829" rx="8" ry="6"/>
    <ellipse cx="1262" cy="954" rx="8" ry="6"/><ellipse cx="1291" cy="942" rx="7" ry="5"/><ellipse cx="1321" cy="927" rx="8" ry="6"/>
  </g>

  <g fill="#a79b7d" opacity=".22">
    <ellipse cx="555" cy="706" rx="11" ry="3" transform="rotate(-18 555 706)"/>
    <ellipse cx="579" cy="722" rx="8" ry="3" transform="rotate(15 579 722)"/>
    <ellipse cx="1416" cy="861" rx="10" ry="3" transform="rotate(-12 1416 861)"/>
  </g>
</svg>
