name: Export City-01 source audit

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/export-city01-source-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect source audit pack
        run: |
          mkdir -p exported
          cp -R src exported/src
          cp -R docs exported/docs
          cp -R public/assets/commercial exported/commercial-assets
          cp package.json exported/package.json
          cp tsconfig.json exported/tsconfig.json
          find exported -type f | sort > exported/files.txt

      - name: Upload source audit pack
        uses: actions/upload-artifact@v4
        with:
          name: city01-source-audit-${{ github.sha }}
          path: exported
          if-no-files-found: error
          retention-days: 7
