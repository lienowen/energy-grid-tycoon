    <path d="M694 714 L646 730 M884 637 L885 590 M956 638 L1004 601 M1186 744 L1240 718 M1308 772 L1354 752 M990 754 L944 787 M1044 884 L1072 925 M1341 790 L1390 770"
          stroke="url(#curb)" stroke-width="25"/>
    <path d="M694 714 L646 730 M884 637 L885 590 M956 638 L1004 601 M1186 744 L1240 718 M1308 772 L1354 752 M990 754 L944 787 M1044 884 L1072 925 M1341 790 L1390 770"
          stroke="#485051" stroke-width="19"/>
  </g>

  <!-- Small civic roundabout ties the visual center together without reading as a grid node. -->
  <ellipse cx="990" cy="754" rx="28" ry="15" fill="url(#curb)"/>
  <ellipse cx="990" cy="754" rx="22" ry="11" fill="#444c4d" stroke="#252e30" stroke-width="3"/>
  <ellipse cx="990" cy="754" rx="9" ry="4.5" fill="#61775c"/>
</svg>
