name: Export City-01 district sources

on:
  push:
    branches:
      - feat/commercial-standard-recovery-v1
    paths:
      - .github/workflows/export-city01-district-sources.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect district sources
        run: |
          mkdir -p exported/city01-districts
          cp public/assets/city01/product/districts/district-*-base.png exported/city01-districts/

      - name: Upload source pack
        uses: actions/upload-artifact@v4
        with:
          name: city01-district-source-pack-${{ github.sha }}
          path: exported/city01-districts
          if-no-files-found: error
          retention-days: 7
